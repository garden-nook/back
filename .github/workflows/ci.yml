name: CI/CD Pipeline

on:
  push:
    branches: [dev, stage]
  pull_request:
    branches: [dev, stage]

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build-dev:
    name: Build & Push (dev-latest)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:dev-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:dev-buildcache,mode=max

  build-stage:
    name: Build & Push (stage-latest)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stage' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=stage-latest
            type=raw,value=stage-${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:stage-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:stage-buildcache,mode=max

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/garden-nook/docker/dev
            docker compose pull
            IMAGE_TAG=dev-${{ github.sha }} docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deployed dev-${{ github.sha }}"

  deploy-stage:
    name: Deploy to STAGE
    runs-on: ubuntu-latest
    needs: build-stage
    if: github.ref == 'refs/heads/stage' && github.event_name == 'push'
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/garden-nook/docker/stage
            docker compose pull
            IMAGE_TAG=stage-${{ github.sha }} docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deployed stage-${{ github.sha }}"