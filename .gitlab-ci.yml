stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY_IMAGE: $CI_REGISTRY_USER/$CI_PROJECT_NAME

build-dev:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_BUILDKIT: 1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --cache-from $REGISTRY_IMAGE:dev-latest \
        --tag $REGISTRY_IMAGE:dev-latest \
        --tag $REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        .
    - docker push $REGISTRY_IMAGE:dev-latest
    - docker push $REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build-stage:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_BUILDKIT: 1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --cache-from $REGISTRY_IMAGE:stage-latest \
        --tag $REGISTRY_IMAGE:stage-latest \
        --tag $REGISTRY_IMAGE:stage-$CI_COMMIT_SHORT_SHA \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        .
    - docker push $REGISTRY_IMAGE:stage-latest
    - docker push $REGISTRY_IMAGE:stage-$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"

deploy-dev:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $VPS_USER@$VPS_HOST << EOF
        set -e
        cd /opt/agro/docker/dev
        docker compose pull
        IMAGE_TAG=dev-$CI_COMMIT_SHORT_SHA docker compose up -d --remove-orphans
        docker image prune -f
      EOF
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - build-dev

deploy-stage:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $VPS_USER@$VPS_HOST << EOF
        set -e
        cd /opt/agro/docker/stage
        docker compose pull
        IMAGE_TAG=stage-$CI_COMMIT_SHORT_SHA docker compose up -d --remove-orphans
        docker image prune -f
      EOF
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
  needs:
    - build-stage